<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile — BhoomiVeda</title>
  <link rel="icon" href="../assets/favicon.svg" />
  <script src="../shared/tailwind-config.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="../shared/language.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="../shared/shell.css" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../sidebar/sidebar.css" />
  <link rel="stylesheet" href="../navbar/navbar.css" />
  <link rel="stylesheet" href="../ai-assistant/ai-assistant.css" />
  <link rel="stylesheet" href="profile.css" />
</head>
<body data-protected="true" data-page="profile" data-page-title="My Profile" data-page-title-key="profile" class="bg-gray-50 dark:bg-gray-950">
<div class="flex h-screen overflow-hidden">
  <div data-include="../sidebar/sidebar.html" class="hidden md:flex"></div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div class="flex items-center md:hidden px-4 py-3 border-b bg-white dark:bg-gray-900 border-gray-100 dark:border-gray-800">
      <button class="p-2 rounded-lg"><i data-lucide="menu"></i></button>
      <div class="flex items-center gap-2.5 ml-2 min-w-0">
        <div class="h-8 w-8 overflow-hidden flex-shrink-0">
          <img src="../assets/bhoomiveda-logo.png" alt="" class="w-full h-[200%] max-w-none object-contain object-top" />
        </div>
        <span class="font-extrabold uppercase tracking-[0.14em] leading-none text-xs text-gray-900 dark:text-white">
          Bhoomi<span class="text-green-600">Veda</span>
        </span>
      </div>
    </div>
    <div data-include="../navbar/navbar.html"></div>
    <main class="flex-1 overflow-y-auto">
<div class="bg-slate-50 dark:bg-slate-950 min-h-screen p-4 sm:p-6 md:p-8">
  <div class="max-w-4xl mx-auto">

    <!-- Profile hero -->
    <div class="bg-gradient-to-r from-emerald-900 via-teal-900 to-slate-900 border border-emerald-800/60 dark:border-slate-800 rounded-2xl p-6 sm:p-7 text-white mb-6 relative overflow-hidden shadow-md">
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-6">
        <button id="bv-photo-btn" type="button" title="Change profile photo"
          class="relative w-20 h-20 rounded-2xl bg-emerald-800/60 dark:bg-slate-800 flex items-center justify-center text-2xl font-bold border-2 border-emerald-500/60 dark:border-emerald-500/40 overflow-hidden cursor-pointer group shadow-inner">
          <span id="bv-avatar-initials">K</span>
          <img id="bv-avatar-img" alt="" class="hidden absolute inset-0 w-full h-full object-cover" />
          <span class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-xs font-bold text-white">
            <i data-lucide="camera" style="width:18px;height:18px"></i>
          </span>
        </button>
        <input id="bv-photo-input" type="file" accept="image/jpeg,image/jpg,image/png,image/webp" class="hidden" />

        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-0.5">
            <h2 id="bv-fullname" class="text-2xl font-extrabold truncate">Kisan</h2>
            <span class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded font-bold uppercase tracking-wider flex items-center gap-1">
              <i data-lucide="check-circle-2" style="width:11px;height:11px"></i> Verified Kisan
            </span>
          </div>
          <p class="text-emerald-300 dark:text-slate-400 text-xs sm:text-sm font-medium flex items-center gap-1.5">
            <i data-lucide="map-pin" style="width:14px;height:14px" class="text-emerald-400"></i>
            <span id="bv-location">—</span>
          </p>
          <div class="flex gap-4 mt-3 text-xs sm:text-sm flex-wrap text-emerald-100/90 dark:text-slate-300 font-medium">
            <span class="flex items-center gap-1.5"><i data-lucide="sprout" style="width:14px;height:14px" class="text-emerald-400"></i> <span id="bv-landsize">—</span></span>
            <span class="flex items-center gap-1.5"><i data-lucide="calendar" style="width:14px;height:14px" class="text-emerald-400"></i> <span id="bv-since">—</span></span>
            <span class="flex items-center gap-1.5"><i data-lucide="star" class="text-amber-400" style="width:14px;height:14px"></i> <span id="bv-points">0</span> <span data-i18n="pts">pts</span></span>
          </div>
        </div>
        <button id="bv-edit-open" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-sm flex items-center gap-2 active:scale-98">
          <i data-lucide="edit" style="width:15px;height:15px"></i><span data-i18n="editProfile">Edit Profile</span>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Personal & Farm Details -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 sm:p-6 shadow-sm">
        <h3 class="font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2 text-sm"><i data-lucide="user" class="text-emerald-600 dark:text-emerald-400" style="width:16px;height:16px"></i><span data-i18n="profileDetails">Profile Details</span></h3>
        <div class="space-y-3" id="bv-farm"></div>
      </div>

      <!-- Productivity -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 sm:p-6 shadow-sm">
        <h3 class="font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2 text-sm"><i data-lucide="bar-chart-2" class="text-emerald-600 dark:text-emerald-400" style="width:16px;height:16px"></i><span data-i18n="productivityStats">Productivity Stats</span></h3>
        <div class="grid grid-cols-2 gap-3 mb-4" id="bv-stats"></div>
        <div style="height:110px"><canvas id="bv-profile-chart"></canvas></div>
      </div>

      <!-- Achievements -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 sm:p-6 shadow-sm">
        <h3 class="font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2 text-sm"><i data-lucide="award" class="text-amber-500" style="width:16px;height:16px"></i><span data-i18n="achievements">Achievements</span></h3>
        <div class="grid grid-cols-3 gap-2" id="bv-badges"></div>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div id="bv-edit-modal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto" id="bv-edit-card">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-bold text-lg text-slate-900 dark:text-white" data-i18n="editProfileTitle">Edit Profile</h3>
        <button id="bv-edit-close" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-colors"><i data-lucide="x" style="width:18px;height:18px"></i></button>
      </div>
      <div class="space-y-4" id="bv-edit-fields"></div>
      <div class="flex gap-3 mt-6">
        <button id="bv-edit-cancel" data-i18n="cancel" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Cancel</button>
        <button id="bv-edit-save" data-i18n="saveChanges" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-500 transition-all shadow-sm">Save Changes</button>
      </div>
    </div>
  </div>
</div>
    </main>
  </div>
  <div data-include="../ai-assistant/ai-assistant.html"></div>
</div>
<script src="../shared/data.js"></script>
<script src="../shared/shell.js"></script>
<script src="../sidebar/sidebar.js"></script>
<script src="../navbar/navbar.js"></script>
<script src="../ai-assistant/ai-assistant.js"></script>
<script src="profile.js"></script>
</body>
</html>
