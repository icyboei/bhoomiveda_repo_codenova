<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Community — BhoomiVeda</title>
  <link rel="icon" href="../assets/favicon.svg" />
  <script src="../shared/tailwind-config.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="../shared/language.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="../shared/shell.css" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../sidebar/sidebar.css" />
  <link rel="stylesheet" href="../navbar/navbar.css" />
  <link rel="stylesheet" href="../ai-assistant/ai-assistant.css" />
  <link rel="stylesheet" href="community.css" />
</head>
<body data-protected="true" data-page="community" data-page-title="Community" data-page-title-key="community" class="bg-gray-50 dark:bg-gray-950">
<div class="flex h-screen overflow-hidden">
  <div data-include="../sidebar/sidebar.html" class="hidden md:flex"></div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div class="flex items-center md:hidden px-4 py-3 border-b bg-white dark:bg-gray-900 border-gray-100 dark:border-gray-800">
      <button class="p-2 rounded-lg"><i data-lucide="menu"></i></button>
      <div class="flex items-center gap-2.5 ml-2 min-w-0">
        <div class="h-8 w-8 overflow-hidden flex-shrink-0">
          <img src="../assets/bhoomiveda-logo.png" alt="" class="w-full h-[200%] max-w-none object-contain object-top" />
        </div>
        <span class="font-extrabold uppercase tracking-[0.14em] leading-none text-xs text-gray-900 dark:text-white">
          Bhoomi<span class="text-green-600">Veda</span>
        </span>
      </div>
    </div>
    <div data-include="../navbar/navbar.html"></div>
    <main class="flex-1 overflow-y-auto">
<div class="bg-slate-50 dark:bg-slate-950 min-h-screen p-4 sm:p-6 md:p-8">
  <!-- Header -->
  <div class="mb-6 flex items-center justify-between flex-wrap gap-4">
    <div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight" data-i18n="communityTitle">
        <div class="p-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 border border-emerald-200/50 dark:border-emerald-800/40">
          <i data-lucide="users" style="width:20px;height:20px"></i>
        </div>
        <span>Farmer Community</span>
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1 font-medium" data-i18n="communitySubtitle">Connect, share agricultural experiences, and grow together</p>
    </div>
    <div class="flex items-center gap-2.5 px-3.5 py-2 rounded-xl border bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-sm shadow-sm focus-within:border-emerald-500 transition-colors">
      <i data-lucide="search" class="text-slate-400 dark:text-slate-500" style="width:16px;height:16px"></i>
      <input data-i18n-attr="placeholder:searchPosts" placeholder="Search community posts..." class="outline-none bg-transparent text-sm text-slate-900 dark:text-white w-40 font-medium" />
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Feed -->
    <div class="lg:col-span-2 space-y-5">
      <!-- Composer -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
        <div class="flex gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-sm flex-shrink-0 shadow-sm">K</div>
          <div class="flex-1">
            <textarea id="bv-new-post" data-i18n-attr="placeholder:composerPlaceholder" placeholder="Share your farming experience, crop tips, or ask a question..."
              class="w-full text-sm font-medium resize-none outline-none bg-transparent text-slate-900 dark:text-white placeholder-slate-400 h-16"></textarea>
            <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800">
              <div class="flex gap-3">
                <button class="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-emerald-600 flex items-center gap-1.5 transition-colors"><i data-lucide="camera" style="width:15px;height:15px"></i><span data-i18n="photo">Photo</span></button>
                <button class="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-emerald-600 flex items-center gap-1.5 transition-colors"><i data-lucide="map-pin" style="width:15px;height:15px"></i><span data-i18n="location">Location</span></button>
              </div>
              <button class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5"><i data-lucide="send" style="width:13px;height:13px"></i><span data-i18n="post">Post</span></button>
            </div>
          </div>
        </div>
      </div>
      <div id="bv-posts" class="space-y-5"></div>
    </div>

    <!-- Sidebar -->
    <div class="space-y-5">
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
        <h3 class="font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2 text-sm" data-i18n="trendingTopics">
          <i data-lucide="trending-up" class="text-emerald-600 dark:text-emerald-400" style="width:16px;height:16px"></i>
          <span>Trending Topics</span>
        </h3>
        <div class="space-y-2" id="bv-trending"></div>
      </div>
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
        <h3 class="font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2 text-sm" data-i18n="askExperts">
          <i data-lucide="help-circle" class="text-emerald-600 dark:text-emerald-400" style="width:16px;height:16px"></i>
          <span>Ask Experts</span>
        </h3>
        <div class="space-y-3" id="bv-experts"></div>
        <button onclick="window.location.href='../ask-expert/index.html'" data-i18n="askQuestionBtn" class="mt-3.5 w-full border border-dashed border-emerald-400 dark:border-emerald-600 text-emerald-700 dark:text-emerald-400 py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-50 dark:hover:bg-emerald-950/40 transition-colors">+ Ask a Question</button>
      </div>
      <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
        <h3 class="font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2 text-sm" data-i18n="topFarmers">
          <i data-lucide="award" class="text-amber-500" style="width:16px;height:16px"></i>
          <span>Top Farmers</span>
        </h3>
        <div class="space-y-2" id="bv-leaderboard"></div>
      </div>
    </div>
  </div>
</div>
    </main>
  </div>
  <div data-include="../ai-assistant/ai-assistant.html"></div>
</div>
<script src="../shared/data.js"></script>
<script src="../shared/shell.js"></script>
<script src="../sidebar/sidebar.js"></script>
<script src="../navbar/navbar.js"></script>
<script src="../ai-assistant/ai-assistant.js"></script>
<script src="community.js"></script>
</body>
</html>
